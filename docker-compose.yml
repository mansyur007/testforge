# TestForge — one-command setup (PRD §5.4): docker compose up
services:
  testforge:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/testforge.db"
      AUTH_SECRET: "${AUTH_SECRET:-ganti-secret-ini-di-production}"
      # Attachments (F-01) live next to the DB in the same volume.
      TF_UPLOAD_DIR: /data/uploads
      TF_MAX_UPLOAD_MB: "${TF_MAX_UPLOAD_MB:-10}"
      # Notifications (F-08). TF_BASE_URL builds absolute links in messages.
      TF_BASE_URL: "${TF_BASE_URL:-http://localhost:3000}"
      # TF_SECRET: encrypts stored chat-webhook URLs & tracker tokens (falls
      # back to AUTH_SECRET).
      # TF_ALLOW_ANY_WEBHOOK_HOST: "1"  # self-hosters with proxies only
      # Issue trackers (F-07). CRON_SECRET also guards /api/cron/sync-issues.
      # TF_ALLOW_INSECURE_INTEGRATION_URL: "1"  # internal http Jira/GitLab only
      # SSO / 2FA (F-20). All optional; the whole OIDC feature is dormant unless
      # TF_OIDC_ISSUER is set. 2FA (TOTP) needs no env — users enable it per
      # account. TOTP secrets are encrypted with TF_SECRET (above).
      # TF_OIDC_ISSUER: "https://login.example.com/realms/acme"
      # TF_OIDC_CLIENT_ID: "${TF_OIDC_CLIENT_ID:-}"
      # TF_OIDC_CLIENT_SECRET: "${TF_OIDC_CLIENT_SECRET:-}"
      # TF_OIDC_AUTO_PROVISION: "1"        # unknown verified email → new member
      # TF_OIDC_DEFAULT_ROLE: "MEMBER"     # role for auto-provisioned users
      # TF_OIDC_BUTTON_LABEL: "Single sign-on"
      # TF_OIDC_ALLOW_UNVERIFIED_EMAIL: "1" # only if your IdP omits email_verified
      # TF_DISABLE_PASSWORD_LOGIN: "1"     # SSO/social only (needs a provider!)
      # F-41: instance console at /superadmin — a read-only list of every
      # registered user, across organizations. Dormant (404) unless the username
      # and a password are both set. The password is static, so make it long:
      # the plaintext form is rejected under 24 chars. Prefer the bcrypt hash —
      # but escape every `$` as `$$` in compose, or use TF_SUPERADMIN_PASSWORD.
      TF_SUPERADMIN_USER: "${TF_SUPERADMIN_USER:-}"
      TF_SUPERADMIN_PASSWORD: "${TF_SUPERADMIN_PASSWORD:-}"
      # TF_SUPERADMIN_PASSWORD_HASH: "${TF_SUPERADMIN_PASSWORD_HASH:-}"
      # F-34: LDAP / Active Directory. Dormant unless TF_LDAP_URL *and*
      # TF_LDAP_BASE_DN are both set. Local accounts stay usable as a fallback.
      # TF_LDAP_URL: "ldap://ldap.example.com:389"   # or ldaps://…:636
      # TF_LDAP_BASE_DN: "dc=example,dc=com"
      # TF_LDAP_BIND_DN: "cn=svc-testforge,ou=svc,dc=example,dc=com"  # omit = anonymous search
      # TF_LDAP_BIND_PASSWORD: "${TF_LDAP_BIND_PASSWORD:-}"
      # TF_LDAP_USER_FILTER: "(|(uid={{username}})(sAMAccountName={{username}})(mail={{username}}))"
      # TF_LDAP_ATTR_EMAIL: "mail"         # attribute holding the email address
      # TF_LDAP_ATTR_NAME: "cn"            # attribute holding the display name
      # TF_LDAP_AUTO_PROVISION: "1"        # unknown directory user → new member
      # TF_LDAP_DEFAULT_ROLE: "MEMBER"     # role for auto-provisioned users
      # TF_LDAP_ORG_SLUG: ""               # only needed if the instance has >1 org
      # TF_LDAP_START_TLS: "1"             # upgrade a plain ldap:// connection
      # TF_LDAP_TLS_REJECT_UNAUTHORIZED: "0"  # ONLY for a self-signed internal CA
    volumes:
      - testforge-data:/data
    restart: unless-stopped

volumes:
  testforge-data:

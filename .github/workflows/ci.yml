name: CI

# Build gate: runs on every PR to main and every push to main.
# TestForge is Next.js + Prisma, so the gate is `prisma generate` + `next build`
# (catches type errors / broken imports before a deploy). No DB needed at build —
# the SQLite schema is created at runtime via `prisma db push` against the volume.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Build
        env:
          NEXT_PUBLIC_BASE_URL: https://testforge.emha.space
          NEXT_PUBLIC_GITHUB_REPO: mansyur007/test-forge
        run: npm run build

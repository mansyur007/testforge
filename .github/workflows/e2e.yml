name: E2E (Playwright → TestForge)

# Runs the Playwright smoke suite against an ephemeral local dev server in the
# runner, then (on main / schedule / manual) uploads the JUnit results to the
# production TestForge as a test run — dogfooding /api/v1/junit.
#
# Prereqs for the prod upload (already set up): the `super-admin-tf` project on
# testforge.emha.space is seeded with the matching cases (scripts/seed-cases.mjs),
# and repo secret TF_API_KEY holds a prod API key whose user is a member of it.
# Without the secret the upload step is skipped (tests still run).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      TF_PROJECT: super-admin-tf # drives both the TC-<SLUG>-<n> test names and the upload target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push # create the ephemeral SQLite schema
      - run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run e2e

      - name: Upload JUnit to TestForge (prod)
        # Best-effort: the test result above is the CI gate. A failed upload
        # (e.g. prod project not seeded yet) shouldn't redden the run.
        continue-on-error: true
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TF_API_URL: https://testforge.emha.space
          TF_API_KEY: ${{ secrets.TF_API_KEY }}
        run: |
          if [ -z "$TF_API_KEY" ]; then
            echo "TF_API_KEY secret not set — skipping prod upload."
            exit 0
          fi
          npm run e2e:upload

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e-results/
          retention-days: 7
